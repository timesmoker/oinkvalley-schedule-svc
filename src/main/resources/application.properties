spring.application.name=schedule-svc

# SOT: 운영·k3s 값 = infra. 이 파일은 Spring 바인딩 키만 (env 기본값 없음).
server.port=${SERVER_PORT}

jwt.secret=${JWT_SECRET}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.schema=${SPRING_DATASOURCE_HIKARI_SCHEMA}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false

# auth.guest.created 수신 시 샘플 일정. Helm guestCalendar.bootstrap → GUEST_CALENDAR_*
guest.calendar.bootstrap.enabled=${GUEST_CALENDAR_BOOTSTRAP_ENABLED}

# NATS JetStream (NatsProperties). env: NATS_*
nats.url=${NATS_URL}
nats.durable=${NATS_DURABLE}
nats.reconnect-wait=${NATS_RECONNECT_WAIT}
nats.ack-wait=${NATS_ACK_WAIT}
nats.max-deliver=${NATS_MAX_DELIVER}

# profile gRPC. env: SERVICE_PROFILE_GRPC_TARGET
spring.grpc.client.channel.profile.target=${SERVICE_PROFILE_GRPC_TARGET}
